# Render deployment configuration for the Verilog Testbench Generator backend
services:
  - type: web
    name: verilog-tb-generator-backend
    runtime: python
    # Install Rust toolchain first (for packages that use maturin/cargo),
    # then upgrade pip and install Python requirements.
    buildCommand: "bash -lc 'curl https://sh.rustup.rs -sSf | sh -s -- -y && source $HOME/.cargo/env && python -m pip install --upgrade pip && pip install -r requirements.txt'"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: USE_AI
        value: "true"
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        value: demo123
